[project]
name = "doc-loader-with-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nitingarg20", email = "ngarg0668@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "langchain>=1.4.2",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-text-splitters>=1.1.2",
    "numpy>=2.5.3",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.64.0",
    "uuid-utils>=0.17.1",
]

[project.scripts]
doc-loader-with-rag = "doc_loader_with_rag:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
